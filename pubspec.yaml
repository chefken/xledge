name: xledge
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.3
  local_auth: ^2.3.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1 # ADD THIS

flutter:
  uses-material-design: true
  assets:
    - assets/images/xl.png

# ADD THIS BLOCK AT THE VERY BOTTOM
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/xl.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/xl.png"