name: xledge
description: "Premium expense tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.3
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.1
  local_auth: ^2.3.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/xl.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/xl.png